let anim=null;
function go(name,instant){
  const v=views[name]; if(!v)return;
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));
  setCut(v.cut); camera.fov=v.fov; camera.updateProjectionMatrix();
  const from={p:camera.position.clone(),t:controls.target.clone()};
  const to={p:new THREE.Vector3(...v.p),t:new THREE.Vector3(...v.t)};
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){camera.position.copy(to.p);controls.target.copy(to.t);controls.update();return;}
  anim={from,to,start:performance.now(),dur:900};
}
function setCut(h){cut.constant=h;document.querySelectorAll('[data-cut]').forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(+b.dataset.cut-h)<.01)));}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.view);try{history.replaceState(null,'','#'+b.dataset.view)}catch(e){}}));
document.querySelectorAll('[data-cut]').forEach(b=>b.addEventListener('click',()=>setCut(+b.dataset.cut)));

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize); resize();
const start=(location.hash||'').slice(1); go(views[start]?start:'all',true);
function loop(now){
  if(anim){const k=Math.min(1,(now-anim.start)/anim.dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(anim.from.p,anim.to.p,e);controls.target.lerpVectors(anim.from.t,anim.to.t,e);if(k>=1)anim=null;}
  controls.update(); renderer.render(scene,camera); requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
